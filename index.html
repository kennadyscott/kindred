<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindred</title>
<!-- ==========================================================================
     app.kindredtherapymatch.com used to serve the Kindred app. It now lives at
     kindredtherapymatch.com/app/ so it shares an origin -- and therefore a
     session -- with the rest of the site, which is what removed the double
     sign-in after checkout.

     This page stays so nothing breaks for anyone holding the old address: a
     bookmark, a link in an outreach email, a Stripe redirect configured before
     the move. It forwards the path, the query string AND the hash, because the
     hash is what routes someone to matching or to therapist signup.
     ========================================================================== -->
<link rel="canonical" href="https://kindredtherapymatch.com/app/">
<meta name="robots" content="noindex">
<script>
  (function () {
    /* Anyone who used the app before the move still has a service worker
       registered on THIS origin. It is network-first so it will fetch this
       page rather than serve a cached app -- but leaving a worker registered
       for a site that no longer exists is how someone ends up on a ghost copy
       weeks later. Tear it down on the way past. */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
      if (window.caches && caches.keys) {
        caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
      }
    }
    var base = 'https://kindredtherapymatch.com/app/';
    var path = location.pathname.replace(/^\/+/, '');
    location.replace(base + path + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://kindredtherapymatch.com/app/">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background:#FBF9F7; color:#422448; display:grid; place-items:center;
         height:100vh; margin:0; text-align:center; padding:1.5rem; }
  a { color:#BE765F; }
</style>
</head>
<body>
  <p>Kindred has moved to <a href="https://kindredtherapymatch.com/app/">kindredtherapymatch.com/app</a>.<br>Taking you there now…</p>
</body>
</html>
